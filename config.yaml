# One entry per page you want watched.
# name:     short label used in alerts and as the state filename
# url:      the page to fetch
# selector: (optional) CSS selector to narrow what's compared, e.g. "main" or "#content"
#           Leave blank/omit to hash the whole page body text.
# ignore_regex: (optional) list of regex patterns stripped from the text before hashing/diffing
#           (handy for stripping timestamps, view counters, CSRF tokens, etc.)

pages:
  - name: cafelat-news
    url: https://www.cafelat.co.uk/pages/news
    selector: 'div[id$="__main"]'  # Shopify page-content section (skips header/nav)
    ignore_regex: []

  # ---------------------------------------------------------------------------
  # UK WASC Drainage & Wastewater Management Plan (DWMP) Cycle 2 pages.
  # Each company brands its second cycle differently (DWMP28, DWMP29, etc. --
  # none of them actually call it "DWMP2"). Selectors below default to "main"
  # (untested per-site) -- narrow them further if a page fires false alerts
  # from nav/footer churn, the same way cafelat-news was tuned above.
  #
  # Known caveats:
  #  - The Yorkshire Water "hub" (ArcGIS) and Wessex Water "StoryMap" pages are
  #    JS-rendered; a plain HTML fetch sees little content, so change
  #    detection on those will be unreliable.
  #  - Anglian Water and Southern Water are NOT included here: both consistently
  #    return HTTP 403 when fetched from GitHub Actions' IP ranges (but work
  #    fine from a residential/office connection) -- looks like IP/ASN-based bot
  #    blocking that request headers alone can't work around.
  # ---------------------------------------------------------------------------

  # Northumbrian Water -- DWMP28 (still Cycle-1-only content as of last check)
  - name: northumbrian-dwmp-main
    url: https://www.nwl.co.uk/help-and-support/wastewater/dwmp/
    selector: "main"
    ignore_regex: []
